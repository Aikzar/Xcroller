name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libxcb-shape0-dev libxcb-xfixes0-dev
          
      - name: install frontend dependencies
        run: npm install
        
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Xcroller v__VERSION__'
          releaseBody: |
            ## Xcroller v0.2.0

            This release focuses on smoother large media libraries, dependable video previews, and a more polished desktop experience.

            ### Performance and video
            - Virtualized masonry rendering keeps long image and video feeds responsive.
            - Configurable video previews allow 1–5 nearby videos per column, with a balanced default of 3.
            - Cached thumbnails, bounded media loading, and faster hover previews reduce decoder pressure and buffering.
            - Video duration filters support precise minimum and maximum lengths.
            - The fullscreen player now supports sub-second seeking.

            ### Personalization and persistence
            - Settings, filters, active feed, volume, columns, themes, and preview density persist across restarts.
            - New dark and light themes, live accent colors, and refreshed Xcroller branding.
            - Paused auto-scroll controls use a high-contrast white and black treatment in both themes.

            ### Library and navigation reliability
            - Responsive custom-view navigation remains usable with many saved views and narrow windows.
            - Window size/maximized state is restored on launch.
            - Media libraries recover more safely when an external drive changes letter.
            - Folder scanning and refresh actions now show visible progress.

            ### Downloads
            Windows users can install Xcroller with the `.exe` setup file or the `.msi` package attached below.
          releaseDraft: false
          prerelease: false
